<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Aggregator</title>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-primary: #1a1a1a;
      --text-secondary: #4a5568;
      --accent-color: #2563eb;
      --border-color: #e2e8f0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* Tab Navigation */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 10px;
    }

    .tab-btn {
      padding: 8px 18px;
      border: none;
      background: #cbd5e1;
      color: var(--text-primary);
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background 0.2s, color 0.2s;
    }

    .tab-btn.active {
      background: var(--accent-color);
      color: #ffffff;
    }

    /* Cards Layout */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 18px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    .card-title {
      margin: 0 0 10px 0;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
    }

    /* Important: Keeps line breaks intact and ensures text is visible */
    .card-body {
      margin: 0;
      font-size: 0.95rem;
      color: var(--text-secondary);
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      display: block !important;
      visibility: visible !important;
    }

    .loading, .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Navigation Tabs -->
    <nav class="tabs" id="tab-nav">
      <button class="tab-btn active" data-tab="Learn">Learn</button>
      <button class="tab-btn" data-tab="Life">Life</button>
    </nav>

    <!-- Cards Container -->
    <div id="cards-container" class="cards-grid">
      <div class="loading">Loading cards...</div>
    </div>
  </div>

  <script>
    // Paste your Google Apps Script Web App Deployment URL here
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwjlWMzricTk_dQEthEhUiOXYOq3one9kmSb0NHe0U1IxgRdoYxNFdEkoMicIMQocdC/exec";

    let dataset = {};
    let activeTab = "Learn";

    const cardsContainer = document.getElementById('cards-container');
    const tabNav = document.getElementById('tab-nav');

    // Safe DOM construction preventing HTML syntax issues on newlines/quotes
    function createCardElement(item) {
      const card = document.createElement('div');
      card.className = 'card';

      // Title Key Fallbacks
      const title = document.createElement('h3');
      title.className = 'card-title';
      title.textContent = item.title || item.name || item.topic || 'Untitled';

      // Body Content Key Fallbacks (Covers common sheet header names)
      const body = document.createElement('p');
      body.className = 'card-body';
      
      const bodyContent = item.content 
        || item.description 
        || item.body 
        || item.text 
        || item.summary 
        || item.notes 
        || item.details 
        || '';

      body.textContent = bodyContent ? bodyContent : 'No content available.';

      card.appendChild(title);
      card.appendChild(body);
      return card;
    }

    // Render cards based on active tab
    function renderTab(tabName) {
      cardsContainer.innerHTML = '';

      // Match tab name case-insensitively
      const matchingKey = Object.keys(dataset).find(
        key => key.trim().toLowerCase() === tabName.trim().toLowerCase()
      );

      const items = matchingKey ? dataset[matchingKey] : (Array.isArray(dataset) ? dataset : []);

      if (!items || items.length === 0) {
        cardsContainer.innerHTML = `<div class="empty-state">No items found under ${tabName}.</div>`;
        return;
      }

      items.forEach(item => {
        cardsContainer.appendChild(createCardElement(item));
      });
    }

    // Fetch payload from Apps Script
    async function fetchData() {
      try {
        const response = await fetch(WEB_APP_URL);
        const data = await response.json();
        
        console.log("Raw API Response:", data); // Inspect structure in browser console
        
        dataset = data;
        renderTab(activeTab);
      } catch (error) {
        console.error("Fetch Error:", error);
        cardsContainer.innerHTML = `<div class="empty-state">Error loading content. Please check Web App URL permissions.</div>`;
      }
    }

    // Tab switching event listener
    tabNav.addEventListener('click', (e) => {
      if (e.target.classList.contains('tab-btn')) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        e.target.classList.add('active');
        
        activeTab = e.target.getAttribute('data-tab');
        renderTab(activeTab);
      }
    });

    // Initialize
    fetchData();
  </script>
</body>
</html>
