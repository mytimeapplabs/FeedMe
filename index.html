<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FeedMe</title>
  
  <!-- Swiper.js CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header Navigation */
    header {
      padding: 12px 16px;
      background-color: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--accent);
    }

    .tabs {
      display: flex;
      gap: 6px;
      background-color: var(--card-bg);
      padding: 4px;
      border-radius: 8px;
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 6px 12px;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
    }

    .tab-btn.active {
      background-color: var(--accent);
      color: #000;
    }

    /* App Container */
    #app {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .loading {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--text-muted);
      padding: 24px;
    }

    /* Swiper & Card Styles */
    .swiper {
      width: 100%;
      height: 100%;
    }

    .swiper-slide {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 520px;
      height: 100%;
      max-height: 720px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .card-body {
      overflow-y: auto;
      padding-right: 6px;
      flex: 1;
      margin-bottom: 12px;
      -webkit-overflow-scrolling: touch;
    }

    .card-body::-webkit-scrollbar {
      width: 4px;
    }
    .card-body::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    .category {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .title {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 14px;
      color: var(--text);
    }

    /* Content & Markdown Formatting */
    .content {
      font-size: 0.95rem;
      line-height: 1.65;
      color: #cbd5e1;
    }

    .content h1, .content h2, .content h3 {
      color: var(--text);
      margin: 16px 0 8px 0;
      font-weight: 700;
    }
    .content h1 { font-size: 1.15rem; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
    .content h2 { font-size: 1.05rem; }
    .content h3 { font-size: 0.95rem; color: var(--accent); }

    .content p {
      margin-bottom: 12px;
    }

    .content ul, .content ol {
      margin: 8px 0 12px 20px;
    }

    .content li {
      margin-bottom: 4px;
    }

    .content strong {
      color: #f1f5f9;
    }

    /* Card Footer */
    .footer {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .source-link {
      font-size: 0.8rem;
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      max-width: 65%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      background-color: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">FeedMe</div>
    <div class="tabs">
      <button id="tab-inform" class="tab-btn active" onclick="switchTab('inform')">Inform</button>
      <button id="tab-learn" class="tab-btn" onclick="switchTab('learn')">Learn</button>
      <button id="tab-life" class="tab-btn" onclick="switchTab('life')">Life</button>
    </div>
  </header>

  <main id="app">
    <div class="loading">
      <span>Fetching your daily feed...</span>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  
  <script>
    const FEED_API_URL = "https://script.google.com/macros/s/AKfycbwjlWMzricTk_dQEthEhUiOXYOq3one9kmSb0NHe0U1IxgRdoYxNFdEkoMicIMQocdC/exec"; // <-- Ensure your Web App URL is here
    
    let feedData = { inform: [], learn: [], life: [] };
    let currentTab = 'inform';
    let swiperInstance = null;

    async function fetchFeedData() {
      try {
        const response = await fetch(FEED_API_URL);
        if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

        const textData = await response.text();
        let parsed = JSON.parse(textData);

        if (typeof parsed === 'string') parsed = JSON.parse(parsed);

        feedData = {
          inform: Array.isArray(parsed.inform) ? parsed.inform : [],
          learn:  Array.isArray(parsed.learn)  ? parsed.learn  : [],
          life:   Array.isArray(parsed.life)   ? parsed.life   : []
        };

        renderTab(currentTab);
      } catch (err) {
        console.error("FeedMe Render Error:", err);
        document.getElementById('app').innerHTML = `
          <div class="loading" style="padding: 20px;">
            <p>⚠️ <strong>Error loading feed data</strong></p><br>
            <span style="font-size: 0.8rem; color: #ef4444;">${err.message || err}</span><br><br>
            <button onclick="fetchFeedData()" class="btn">Retry</button>
          </div>
        `;
      }
    }

    function switchTab(tabName) {
      currentTab = tabName;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`tab-${tabName}`);
      if (activeBtn) activeBtn.classList.add('active');
      renderTab(tabName);
    }

    function parseMarkdown(str) {
      if (!str) return '';
      let html = str;

      // Convert Headings
      html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
      html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
      html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');

      // Convert Bold & Italics
      html = html.replace(/\*\*(.*?)\*\*/gim, '<strong>$1</strong>');
      html = html.replace(/\*(.*?)\*/gim, '<em>$1</em>');

      // Convert Bullet points
      html = html.replace(/^\• (.*$)/gim, '<li>$1</li>');
      html = html.replace(/^ - (.*$)/gim, '<li>$1</li>');

      // Convert Line breaks & Paragraphs
      html = html.replace(/\n\n/g, '</p><p>');
      html = html.replace(/\n/g, '<br>');

      return `<p>${html}</p>`;
    }

    function renderTab(tabName) {
      const posts = feedData[tabName] || [];
      const total = posts.length;

      if (total === 0) {
        document.getElementById('app').innerHTML = `
          <div class="loading">
            No cards available in <strong>${tabName.toUpperCase()}</strong> tab today.
          </div>`;
        return;
      }

      let slidesHtml = '';
      posts.forEach((post, index) => {
        const title = post.title || 'Untitled Card';
        const formattedContent = parseMarkdown(post.content || '');
        const category = post.category || tabName.toUpperCase();
        const sourceName = post.source_name || '';
        const sourceUrl = post.source_url || '';

        slidesHtml += `
          <div class="swiper-slide">
            <div class="card">
              <div class="card-body">
                <div class="category">${index + 1}/${total} • ${category}</div>
                <h2 class="title">${title}</h2>
                <div class="content">${formattedContent}</div>
              </div>
              <div class="footer">
                ${sourceUrl 
                  ? `<a href="${sourceUrl}" target="_blank" rel="noopener" class="source-link">🔗 ${sourceName || 'Read Source'}</a>` 
                  : `<span class="source-link">${sourceName}</span>`}
                <div class="actions">
                  <button class="btn" onclick="rate('up')">👍</button>
                  <button class="btn" onclick="rate('down')">👎</button>
                </div>
              </div>
            </div>
          </div>
        `;
      });

      document.getElementById('app').innerHTML = `
        <div class="swiper">
          <div class="swiper-wrapper">
            ${slidesHtml}
          </div>
        </div>
      `;

      if (swiperInstance) swiperInstance.destroy(true, true);
      swiperInstance = new Swiper('.swiper', {
        direction: 'horizontal',
        loop: false,
        spaceBetween: 12,
        observer: true,
        observeParents: true,
        nested: true
      });
    }

    function rate(type) {
      alert(type === 'up' ? 'Saved feedback: Liked' : 'Saved feedback: Disliked');
    }

    fetchFeedData();
  </script>
</body>
</html>
