<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FeedMe</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-color: #12a1a2;
      --border-color: #334155;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      margin: 0;
      padding: 16px;
      overflow-x: hidden;
    }

    .container { max-width: 900px; margin: 0 auto; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-primary);
    }

    /* Day Navigation Controls (-1 / +1) */
    .day-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card-bg);
      padding: 4px 8px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
    }

    .day-btn {
      background: none;
      border: none;
      color: var(--text-primary);
      font-weight: bold;
      font-size: 0.9rem;
      padding: 4px 10px;
      cursor: pointer;
      border-radius: 12px;
      transition: background 0.2s;
    }

    .day-btn:hover { background: rgba(255, 255, 255, 0.1); }
    .day-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .day-label {
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-weight: 600;
      min-width: 75px;
      text-align: center;
    }

    /* Tab Navigation */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-secondary);
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--accent-color);
      color: #ffffff;
      border-color: var(--accent-color);
    }

    /* Horizontal Swipe Carousel Layout */
    .cards-carousel {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      gap: 16px;
      padding-bottom: 16px;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    /* Hide scrollbars while retaining scroll functionality */
    .cards-carousel::-webkit-scrollbar { display: none; }
    .cards-carousel { -ms-overflow-style: none; scrollbar-width: none; }

    .card {
      flex: 0 0 88%; /* Shows card with a slight peek of the next card */
      max-width: 480px;
      scroll-snap-align: center;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid var(--border-color);
    }

    @media (min-width: 640px) {
      .card {
        flex: 0 0 360px; /* Fixed width cards on larger displays */
      }
    }

    .card-title {
      margin: 0 0 12px 0;
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.35;
      color: var(--text-primary);
    }

    .card-body {
      margin: 0;
      font-size: 0.95rem;
      color: var(--text-secondary);
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      display: block !important;
      visibility: visible !important;
    }

    .loading, .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">⚡ FeedMe</div>
      
      <!-- Day Navigation (-1 / Today / +1) -->
      <div class="day-nav">
        <button id="prev-day-btn" class="day-btn" title="Yesterday">-1</button>
        <span id="day-label" class="day-label">Today</span>
        <button id="next-day-btn" class="day-btn" title="Today" disabled>+1</button>
      </div>
    </header>

    <nav class="tabs" id="tab-nav">
      <button class="tab-btn active" data-tab="News">📰 News</button>
      <button class="tab-btn" data-tab="Learn">💡 Learn</button>
      <button class="tab-btn" data-tab="Life">🌱 Life</button>
    </nav>

    <main id="cards-container" class="cards-carousel">
      <div class="loading">Loading feed...</div>
    </main>
  </div>

  <script>
    // REPLACE WITH YOUR APPS SCRIPT WEB APP URL
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwjlWMzricTk_dQEthEhUiOXYOq3one9kmSb0NHe0U1IxgRdoYxNFdEkoMicIMQocdC/exec";

    let dataset = {};
    let activeTab = "News";
    let dayOffset = 0; // 0 = Today, -1 = Yesterday

    const cardsContainer = document.getElementById('cards-container');
    const tabNav = document.getElementById('tab-nav');
    const prevDayBtn = document.getElementById('prev-day-btn');
    const nextDayBtn = document.getElementById('next-day-btn');
    const dayLabel = document.getElementById('day-label');

    function createCardElement(item) {
      const card = document.createElement('article');
      card.className = 'card';

      const title = document.createElement('h3');
      title.className = 'card-title';
      title.textContent = item.title || item.subject || item.topic || item.name || 'Untitled';

      const body = document.createElement('p');
      body.className = 'card-body';
      const bodyContent = item.content || item.body || item.description || item.summary || item.text || item.notes || item.details || '';
      body.textContent = bodyContent ? bodyContent : 'No content available.';

      card.appendChild(title);
      card.appendChild(body);
      return card;
    }

    function updateDayNavControls() {
      if (dayOffset === 0) {
        dayLabel.textContent = "Today";
        nextDayBtn.disabled = true;
      } else if (dayOffset === -1) {
        dayLabel.textContent = "Yesterday";
        nextDayBtn.disabled = false;
      } else {
        dayLabel.textContent = `${dayOffset} Days`;
        nextDayBtn.disabled = false;
      }
    }

    function renderTab(tabName) {
      cardsContainer.innerHTML = '';

      const matchingKey = Object.keys(dataset).find(
        k => k.trim().toLowerCase() === tabName.trim().toLowerCase()
      );
      
      let items = matchingKey ? dataset[matchingKey] : [];

      if (Array.isArray(items) && items.length > 0 && dayOffset !== 0) {
        const targetDateStr = getTargetDateString(dayOffset);
        const filtered = items.filter(item => {
          if (!item.date) return true;
          return item.date.includes(targetDateStr);
        });
        if (filtered.length > 0) items = filtered;
      }

      if (!items || items.length === 0) {
        cardsContainer.innerHTML = `<div class="empty-state">No items found under "${tabName}".</div>`;
        return;
      }

      items.forEach(item => cardsContainer.appendChild(createCardElement(item)));
      cardsContainer.scrollLeft = 0; // Reset scroll position to first card on tab change
    }

    function getTargetDateString(offsetDays) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      return d.toISOString().split('T')[0];
    }

async function fetchData() {
      cardsContainer.innerHTML = `<div class="loading">Loading feed...</div>`;
      try {
        const requestUrl = new URL(WEB_APP_URL);
        requestUrl.searchParams.set("offset", dayOffset);

        const response = await fetch(requestUrl);
        let rawData = await response.json();

        // Debug log: Open F12 / Inspect -> Console to view exact JSON shape
        console.log("Raw API Response:", rawData);

        // Unwrap common parent properties if nested
        if (rawData && typeof rawData === 'object' && !Array.isArray(rawData)) {
          if (rawData.data) rawData = rawData.data;
          else if (rawData.feed) rawData = rawData.feed;
          else if (rawData.items) rawData = rawData.items;
        }

        dataset = rawData;

        if (dataset.error) {
          cardsContainer.innerHTML = `<div class="empty-state">${dataset.error}</div>`;
          return;
        }

        renderTab(activeTab);
      } catch (error) {
        console.error("Fetch Error:", error);
        cardsContainer.innerHTML = `<div class="empty-state">Unable to load feed. Check API URL & permissions.</div>`;
      }
    }

    function renderTab(tabName) {
      cardsContainer.innerHTML = '';
      let items = [];

      const targetCategory = tabName.trim().toLowerCase();

      // Case A: Dataset is a flat array of item objects
      if (Array.isArray(dataset)) {
        items = dataset.filter(item => {
          const cat = (item.category || item.tab || item.type || '').trim().toLowerCase();
          return cat === targetCategory;
        });
      } 
      // Case B: Dataset is an Object with tab keys { News: [...], Learn: [...] }
      else if (dataset && typeof dataset === 'object') {
        const matchingKey = Object.keys(dataset).find(
          k => k.trim().toLowerCase() === targetCategory
        );
        items = matchingKey ? dataset[matchingKey] : [];
      }

      // Date Filtering (Soft check)
      if (Array.isArray(items) && items.length > 0 && dayOffset !== 0) {
        const targetDateStr = getTargetDateString(dayOffset);
        const filtered = items.filter(item => {
          if (!item.date) return true;
          // Match standard ISO or partial date strings
          return String(item.date).includes(targetDateStr);
        });
        if (filtered.length > 0) items = filtered;
      }

      if (!Array.isArray(items) || items.length === 0) {
        cardsContainer.innerHTML = `<div class="empty-state">No items found under "${tabName}".</div>`;
        return;
      }

      items.forEach(item => cardsContainer.appendChild(createCardElement(item)));
      cardsContainer.scrollLeft = 0;
    }

    

    // Event Handlers
    tabNav.addEventListener('click', (e) => {
      const btn = e.target.closest('.tab-btn');
      if (btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeTab = btn.getAttribute('data-tab');
        renderTab(activeTab);
      }
    });

    prevDayBtn.addEventListener('click', () => {
      dayOffset -= 1;
      updateDayNavControls();
      fetchData();
    });

    nextDayBtn.addEventListener('click', () => {
      if (dayOffset < 0) {
        dayOffset += 1;
        updateDayNavControls();
        fetchData();
      }
    });

    fetchData();
  </script>
</body>
</html>
