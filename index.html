<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FeedMe</title>
  
  <!-- Web App Manifest & Embedded App Icons for Android PWA -->
  <link rel="manifest" href="data:application/manifest+json;base64,ewogICJuYW1lIjogIkZlZWRNZSIsCiAgInNob3J0X25hbWUiOiAiRmVlZE1lIiwKICAic3RhcnRfdXJsIjogIi4iLAogICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLAogICJiYWNrZ3JvdW5kX2NvbG9yIjogIiMxMmExYTIiLAogICJ0aGVtZV9jb2xvciI6ICIxMmExYTIiCiB9">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2312a1a2'/><text x='50%' y='65%' font-size='55' text-anchor='middle' fill='white'>🍽️</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2312a1a2'/><text x='50%' y='65%' font-size='55' text-anchor='middle' fill='white'>🍽️</text></svg>">

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #12a1a2;
      --border-color: #334155;
      --read-color: #22c55e;
      --unread-color: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* Header Nav Bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background-color: #090d16;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .brand { font-weight: 700; font-size: 1.1rem; color: var(--accent); display: flex; align-items: center; gap: 6px; }
    
    /* Compact Emoji Icon Tabs */
    .tab-bar { display: flex; gap: 8px; }
    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 1.3rem;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn.active { background: var(--accent); border-color: var(--accent); }

    /* History Controls */
    .history-controls { display: flex; gap: 6px; }
    .nav-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 600;
    }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Content Area */
    main { flex: 1; overflow-y: auto; padding: 12px 12px 40px 12px; }
    
    .date-indicator { text-align: center; font-size: 0.75rem; color: var(--text-sub); margin-bottom: 12px; }

    /* Compact Cards */
    .card-list { display: flex; flex-direction: column; gap: 12px; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 16px 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card-title { font-size: 0.95rem; font-weight: 600; color: var(--text-main); line-height: 1.35; }
    .card-source { font-size: 0.75rem; color: var(--accent); }
    .card-body { font-size: 0.85rem; color: var(--text-sub); line-height: 1.45; white-space: pre-line; }

    /* Card Footer with Checkmark */
    .card-footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding-top: 8px;
      margin-top: 4px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .check-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--unread-color);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .check-btn.read {
      background: rgba(34, 197, 94, 0.15);
      border-color: var(--read-color);
      color: var(--read-color);
    }

    .empty-state { text-align: center; color: var(--text-sub); margin-top: 40px; font-size: 0.9rem; }
  </style>
</head>
<body>

  <header>
    <div class="brand">🍽️ FeedMe</div>
    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchTab('news')" title="News">📰</button>
      <button class="tab-btn" onclick="switchTab('learn')" title="Learn">💡</button>
      <button class="tab-btn" onclick="switchTab('life')" title="Life">🌱</button>
    </div>
    <div class="history-controls">
      <button class="nav-btn" onclick="navigateDay(-1)">-1</button>
      <button class="nav-btn" id="next-btn" onclick="navigateDay(1)" disabled>+1</button>
    </div>
  </header>

  <main id="main-container">
    <div class="date-indicator" id="date-label">Loading feed...</div>
    <div class="card-list" id="card-container"></div>
  </main>

  <script>
    // 👈 LINE 135: Insert Web App URL for GitHub Pages / external hosting
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwjlWMzricTk_dQEthEhUiOXYOq3one9kmSb0NHe0U1IxgRdoYxNFdEkoMicIMQocdC/exec";

    let currentFeedData = { news: [], learn: [], life: [] };
    let currentTab = 'news';
    let currentDateOffset = 0;
    let readCardIds = new Set();

    document.addEventListener("DOMContentLoaded", () => {
      loadFeedForOffset(0);
    });

    function switchTab(tabName) {
      currentTab = tabName;
      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', ['news', 'learn', 'life'][idx] === tabName);
      });
      renderCards();
    }

    function navigateDay(offsetChange) {
      currentDateOffset += offsetChange;
      document.getElementById('next-btn').disabled = (currentDateOffset >= 0);
      loadFeedForOffset(currentDateOffset);
    }

    function getDateStrForOffset(offset) {
      let d = new Date();
      d.setDate(d.getDate() + offset);
      return d.toISOString().split('T')[0];
    }

    function loadFeedForOffset(offset) {
      const dateStr = offset === 0 ? '' : getDateStrForOffset(offset);
      document.getElementById('date-label').innerText = `Loading (${dateStr || 'Today'})...`;
      document.getElementById('card-container').innerHTML = '';

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(onDataLoaded)
          .getFeedDataForDate(dateStr);
      } else {
        // Fallback for GitHub Pages hosting using fetch
        const targetUrl = `${WEB_APP_URL}?action=fetchData${dateStr ? '&date=' + dateStr : ''}`;
        fetch(targetUrl)
          .then(res => res.json())
          .then(data => onDataLoaded(data))
          .catch(err => console.error("Fetch error:", err));
      }
    }

    function onDataLoaded(data) {
      currentFeedData = data || { news: [], learn: [], life: [] };
      const displayDate = data && data.date ? data.date : getDateStrForOffset(currentDateOffset);
      document.getElementById('date-label').innerText = `Feed for: ${displayDate}`;
      renderCards();
    }

    function renderCards() {
      const container = document.getElementById('card-container');
      container.innerHTML = '';

      const cards = currentFeedData[currentTab] || [];

      if (cards.length === 0) {
        container.innerHTML = `<div class="empty-state">No items in this tab for today.</div>`;
        return;
      }

      cards.forEach((card, index) => {
        const cardId = `${currentTab}_${index}`;
        const isRead = readCardIds.has(cardId);

        const cardEl = document.createElement('div');
        cardEl.className = 'card';
        cardEl.innerHTML = `
          <div class="card-title">${escapeHtml(card.title)}</div>
          <div class="card-source">${escapeHtml(card.source || 'Direct Feed')}</div>
          <div class="card-body">${escapeHtml(card.body || card.snippet || '')}</div>
          <div class="card-footer">
            <button class="check-btn ${isRead ? 'read' : ''}" onclick="toggleRead('${cardId}', this)" title="Mark as Read">
              ✓
            </button>
          </div>
        `;
        container.appendChild(cardEl);
      });
    }

    function toggleRead(cardId, btnEl) {
      if (readCardIds.has(cardId)) {
        readCardIds.delete(cardId);
        btnEl.classList.remove('read');
      } else {
        readCardIds.add(cardId);
        btnEl.classList.add('read');
      }
      calculateAndSyncProgress();
    }

    function calculateAndSyncProgress() {
      const totalCards = (currentFeedData.news?.length || 0) + 
                         (currentFeedData.learn?.length || 0) + 
                         (currentFeedData.life?.length || 0);
      if (totalCards === 0) return;

      const readCount = readCardIds.size;
      const score = Math.min(100, Math.round((readCount / totalCards) * 100));

      if (currentDateOffset === 0) {
        const todayStr = getDateStrForOffset(0);
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run.saveDailyMetric(todayStr, score);
        } else {
          fetch(`${WEB_APP_URL}?action=saveMetrics&day=${todayStr}&score=${score}`);
        }
      }
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
